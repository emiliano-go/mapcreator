[project]
site_name = "MapCreator Documentation"
site_description = "MapCreator: a tile-based building map editor with A* pathfinding. Draw floors, connect rooms, navigate A to B."
site_url = "https://emiliano-go.github.io/mapcreator"
docs_dir = "../docs"
site_dir = "site"

copyright = "&copy; 2026 Emiliano Gandini Outeda"

extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
custom_dir = "../docs/overrides"
favicon = "favicon.svg"

font.text = "Ubuntu"
font.code = "JetBrains Mono"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tabs",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/emiliano-go/mapcreator"
name = "MapCreator on GitHub"

[[project.nav]]
"Overview" = "index.md"

[[project.nav]]
"Getting Started" = "getting-started.md"

[[project.nav]]
"Core Concepts" = "core-concepts.md"

[[project.nav]]
"Editor Guide" = "editor-guide.md"

[[project.nav]]
"Viewer Guide" = "viewer-guide.md"

[[project.nav]]
"Tile Types" = "tile-types.md"

[[project.nav]]
"Configuration" = "configuration.md"

[[project.nav]]
"JSON Export" = "json-export.md"

[[project.nav]]
"Pathfinding" = "pathfinding.md"

[[project.nav]]
"Deployment" = "deployment.md"

[project.markdown_extensions]
tables = {}
admonition = {}
toc = { permalink = true }

[project.markdown_extensions.pymdownx]
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
inlinehilite = {}
snippets = {}
superfences = {}
tabbed = { alternate_style = true }
tasklist = { custom_checkbox = true }

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]
